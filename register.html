<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskly — Тіркелу</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="container nav"><a class="brand" href="index.html"><span class="brand-icon">✓</span> Taskly</a><nav class="links"><a href="index.html">Басты бет</a><a class="btn small" href="login.html">Кіру</a></nav></header><main class="container auth-wrap"><section class="panel auth-card"><div class="eyebrow">Бірінші қадам</div><h1>Тіркелу</h1><p class="muted">Жоспарлауды бүгіннен баста.</p><form id="register-form" novalidate><div class="form-field"><label for="name">Аты-жөнің</label><input class="field" id="name" name="name" type="text" placeholder="Аты-жөнің" autocomplete="name" maxlength="70" required></div><div class="form-field"><label for="email">Электрондық пошта</label><input class="field" id="email" name="email" type="email" placeholder="example@mail.com" autocomplete="email" required></div><div class="form-field"><label for="password">Құпиясөз</label><input class="field" id="password" name="password" type="password" minlength="6" placeholder="Кемінде 6 таңба" autocomplete="new-password" required></div><div class="form-field"><label for="confirm">Құпиясөзді қайталау</label><input class="field" id="confirm" name="confirm" type="password" minlength="6" placeholder="Қайталаңыз" autocomplete="new-password" required></div><div class="error" id="message" role="alert"></div><button class="btn" type="submit">Тіркелу →</button></form><div class="notice">Бұл — тек frontend прототипі. Құпиясөз серверге жіберілмейді және сақталмайды. Шынайы құпиясөз қолданбаңыз.</div><div class="auth-bottom">Аккаунтың бар ма? <a href="login.html">Жүйеге кіру</a></div></section></main><footer class="footer"><div class="container">Taskly · Оқу жобасы</div></footer><script src="assets/app.js" defer></script></body></html>
